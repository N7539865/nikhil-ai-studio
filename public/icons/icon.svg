<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Inner glowing gradient squircle -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6" />

  <!-- Central Emblem: Studio 3D Layers & Sparkle -->
  <g filter="url(#shadow)" transform="translate(0, -8)">
    <!-- Main Diamond / Star -->
    <path d="M 256 96 L 292 216 L 412 256 L 292 296 L 256 416 L 220 296 L 100 256 L 220 216 Z" fill="url(#glowGrad)" />

    <!-- Core highlight -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.9" />

    <!-- Little accent sparkles -->
    <path d="M 370 130 L 380 156 L 406 166 L 380 176 L 370 202 L 360 176 L 334 166 L 360 156 Z" fill="#f59e0b" />
    <path d="M 142 330 L 150 350 L 170 358 L 150 366 L 142 386 L 134 366 L 114 358 L 134 350 Z" fill="#ec4899" />
  </g>

  <!-- Bottom App Title text (clean monogram) -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">NIKHIL AI</text>
</svg>
